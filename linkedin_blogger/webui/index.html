<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Blogger</title>
<style>
  :root { --bg:#F4F6F7; --surface:#fff; --raise:#FBFCFD; --ink:#19212A; --muted:#586069; --faint:#899098;
          --line:#E4E7EA; --line2:#D5DADE; --navy:#16324F; --navy-soft:#E7EEF4;
          --ok:#1D9E75; --ok-bg:#E6F5EF; --ok-ink:#0F6E56; --warn:#C77D2E; --warn-bg:#FBEFE0; --warn-ink:#8A531A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161A; --surface:#1A2027; --raise:#20272F; --ink:#E8EBEE; --muted:#A3ABB3; --faint:#6F777F;
            --line:#2A313A; --line2:#343C45; --navy:#8FB8DC; --navy-soft:#1E2B39;
            --ok:#46C79C; --ok-bg:#123528; --ok-ink:#7FE0BF; --warn:#E0A45E; --warn-bg:#3A2A17; --warn-ink:#F0C48D; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 26px 20px 60px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .tile { width: 38px; height: 38px; border-radius: 10px; background: var(--navy); color: #F5F3EC; display: grid; place-items: center; font-weight: 700; }
  h1 { font-size: 17px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; margin: 1px 0 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line2); color: var(--muted); }
  .chip.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .phead { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .phead h2 { font-size: 14px; margin: 0; }
  .count { font-size: 12px; color: var(--faint); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .list { padding: 6px 16px 12px; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 10px 0; margin: 0; }
  .row { display: flex; gap: 14px; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row-main { min-width: 0; }
  .row-t { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row-p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .row-meta { text-align: right; flex: none; }
  .row-id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--faint); }
  .row-sched { font-size: 11.5px; color: var(--navy); margin-top: 3px; }
  .st { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--navy-soft); color: var(--navy); }
  .st.posted { background: var(--ok-bg); color: var(--ok-ink); }
  .st.failed { background: var(--warn-bg); color: var(--warn-ink); }
  .st.skeleton, .st.pending { background: var(--line); color: var(--muted); }

  .btn { font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 8px; padding: 6px 12px; border: 1px solid var(--line2); background: var(--surface); color: var(--ink); cursor: pointer; }
  .btn:hover { border-color: var(--navy); }
  .ref { margin: 0; padding: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; color: var(--ink); border-top: 1px solid var(--line); background: var(--raise); max-height: 340px; overflow: auto; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 22px; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--navy-soft); color: var(--navy); padding: 1px 6px; border-radius: 5px; }

  .btn.primary { background: var(--navy); color: #F5F3EC; border-color: var(--navy); }
  .btn.primary:hover { filter: brightness(1.06); border-color: var(--navy); }
  .btn:disabled, .btn:disabled:hover { opacity: .5; cursor: default; border-color: var(--line2); filter: none; }
  .flow { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0 2px; }
  .ideas { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .idea { display: flex; gap: 10px; padding: 11px 12px; border: 1px solid var(--line2); border-radius: 9px; cursor: pointer; }
  .idea:hover { border-color: var(--navy); }
  .idea.sel { border-color: var(--navy); background: var(--navy-soft); }
  .idea input { margin-top: 3px; flex: none; }
  .idea-t { font-size: 13.5px; font-weight: 600; display: block; }
  .idea-a { font-size: 12.5px; color: var(--muted); margin-top: 2px; display: block; }
  .idea-r { font-size: 12px; color: var(--faint); margin-top: 3px; display: block; }
  .dirlabel { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  .dir { width: 100%; font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--raise); color: var(--ink); resize: vertical; }
  #skeletonBtn { margin-top: 10px; }
  .count.busy { color: var(--navy); }
  .count.err { color: var(--warn-ink); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="tile">VN</div>
        <div><h1>LinkedIn Blogger</h1><p class="sub">running locally</p></div>
      </div>
      <div class="chips" id="chips"><span class="chip">loading&hellip;</span></div>
    </header>

    <section class="panel" id="newPost">
      <div class="phead"><h2>New post</h2><span class="count" id="flowMsg"></span></div>
      <div class="list">
        <div class="flow">
          <button class="btn" id="ingestBtn">1 &middot; Run ingest</button>
          <button class="btn" id="brainstormBtn">2 &middot; Brainstorm ideas</button>
          <button class="btn" id="reshuffleBtn" hidden>Reshuffle</button>
        </div>
        <div class="ideas" id="ideas"></div>
        <div id="skeletonStep" hidden>
          <label class="dirlabel" for="direction">Direction for the draft (optional)</label>
          <textarea class="dir" id="direction" rows="2" placeholder="Any angle, emphasis, or tone to steer the skeleton"></textarea>
          <button class="btn primary" id="skeletonBtn" disabled>3 &middot; Create skeleton draft</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="phead"><h2>Drafts</h2><span class="count" id="draftCount"></span></div>
      <div class="list" id="drafts"><p class="empty">Loading&hellip;</p></div>
    </section>

    <section class="panel">
      <div class="phead"><h2>Queue</h2><span class="count" id="queueCount"></span></div>
      <div class="list" id="queue"><p class="empty">Loading&hellip;</p></div>
    </section>

    <section class="panel">
      <div class="phead"><h2>Reference notes</h2><button class="btn" id="refBtn">View</button></div>
      <pre class="ref" id="reference" hidden></pre>
    </section>

    <p class="foot">Ingest, brainstorm, and skeleton run here. Filling gaps, checking, and publishing still run from the CLI for now. Stop the server with <code>Ctrl+C</code>.</p>
  </div>

  <script>
    function esc(s) {
      return (s || "").replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    async function getJSON(url) { const r = await fetch(url); return r.json(); }
    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
      return data;
    }
    function pill(status) { return '<span class="st ' + esc(status) + '">' + esc(status) + "</span>"; }
    function flowMsg(text, cls) {
      var el = document.getElementById("flowMsg");
      el.textContent = text || "";
      el.className = "count" + (cls ? " " + cls : "");
    }

    function renderList(id, items, emptyMsg) {
      var el = document.getElementById(id);
      if (!items.length) { el.innerHTML = '<p class="empty">' + emptyMsg + "</p>"; return; }
      el.innerHTML = items.map(function (it) {
        var sched = it.scheduled_at ? '<div class="row-sched">' + new Date(it.scheduled_at).toLocaleString() + "</div>" : "";
        return '<div class="row"><div class="row-main"><div class="row-t">' +
          esc(it.title || "(untitled)") + " " + pill(it.status) + '</div><div class="row-p">' +
          esc(it.preview) + '&hellip;</div></div><div class="row-meta"><div class="row-id">' +
          esc(it.id) + "</div>" + sched + "</div></div>";
      }).join("");
    }

    async function load() {
      try {
        var s = await getJSON("/api/status");
        var last = s.last_posted_at ? "last post " + new Date(s.last_posted_at).toLocaleDateString() : "no posts yet";
        document.getElementById("chips").innerHTML =
          '<span class="chip ' + (s.reference_exists ? "ok" : "warn") + '">' +
          (s.reference_exists ? "reference ready" : "no reference · run ingest") + "</span>" +
          '<span class="chip">' + s.draft_count + " drafts</span>" +
          '<span class="chip">' + s.queued_count + " queued</span>" +
          '<span class="chip">' + last + "</span>";
        document.getElementById("draftCount").textContent = s.draft_count + " total";
        document.getElementById("queueCount").textContent = s.queued_count + " scheduled";

        var d = await getJSON("/api/drafts");
        renderList("drafts", d.drafts, "No drafts yet. Run <code>ingest</code>, then <code>brainstorm</code>.");
        var q = await getJSON("/api/queue");
        renderList("queue", q.queue, "Queue is empty.");
      } catch (e) {
        document.getElementById("chips").innerHTML = '<span class="chip warn">could not reach server</span>';
      }
    }

    var selectedIdea = null;

    function renderIdeas(ideas, selIndex) {
      var box = document.getElementById("ideas");
      if (!ideas || !ideas.length) {
        box.innerHTML = "";
        document.getElementById("skeletonStep").hidden = true;
        document.getElementById("reshuffleBtn").hidden = true;
        return;
      }
      box.innerHTML = ideas.map(function (it, i) {
        return '<label class="idea" data-i="' + i + '"><input type="radio" name="idea" value="' + i + '">' +
          '<span><span class="idea-t">' + esc(it.title || "(untitled)") + "</span>" +
          '<span class="idea-a">' + esc(it.angle || "") + "</span>" +
          '<span class="idea-r">' + esc(it.rationale || "") + "</span></span></label>";
      }).join("");
      document.getElementById("skeletonStep").hidden = false;
      document.getElementById("reshuffleBtn").hidden = false;

      Array.prototype.forEach.call(box.querySelectorAll('input[name="idea"]'), function (input) {
        input.addEventListener("change", function () {
          selectedIdea = parseInt(this.value, 10);
          Array.prototype.forEach.call(box.querySelectorAll(".idea"), function (l) { l.classList.remove("sel"); });
          this.closest(".idea").classList.add("sel");
          document.getElementById("skeletonBtn").disabled = false;
        });
      });

      selectedIdea = (selIndex === 0 || selIndex) ? selIndex : null;
      if (selectedIdea != null) {
        var chosen = box.querySelector('.idea[data-i="' + selectedIdea + '"]');
        if (chosen) { chosen.classList.add("sel"); chosen.querySelector("input").checked = true; }
        document.getElementById("skeletonBtn").disabled = false;
      } else {
        document.getElementById("skeletonBtn").disabled = true;
      }
    }

    async function runBrainstorm(reshuffle) {
      flowMsg(reshuffle ? "Reshuffling ideas&hellip;" : "Brainstorming ideas&hellip;", "busy");
      document.getElementById("brainstormBtn").disabled = true;
      document.getElementById("reshuffleBtn").disabled = true;
      try {
        var r = await postJSON("/api/brainstorm", { reshuffle: !!reshuffle });
        renderIdeas(r.ideas, null);
        flowMsg(r.ideas.length + " ideas. Pick one, then create the skeleton.");
      } catch (e) {
        flowMsg(e.message, "err");
      } finally {
        document.getElementById("brainstormBtn").disabled = false;
        document.getElementById("reshuffleBtn").disabled = false;
      }
    }

    document.getElementById("ingestBtn").addEventListener("click", async function () {
      this.disabled = true;
      flowMsg("Collecting activity since your last post&hellip;", "busy");
      try {
        var r = await postJSON("/api/ingest");
        flowMsg(r.since
          ? "Reference rebuilt (since " + new Date(r.since).toLocaleDateString() + ")."
          : "Reference rebuilt (all history, no prior post yet).");
        load();
      } catch (e) {
        flowMsg(e.message, "err");
      } finally {
        this.disabled = false;
      }
    });

    document.getElementById("brainstormBtn").addEventListener("click", function () { runBrainstorm(false); });
    document.getElementById("reshuffleBtn").addEventListener("click", function () { runBrainstorm(true); });

    document.getElementById("skeletonBtn").addEventListener("click", async function () {
      if (selectedIdea == null) return;
      this.disabled = true;
      flowMsg("Writing skeleton draft&hellip;", "busy");
      try {
        await postJSON("/api/select", { index: selectedIdea, comment: document.getElementById("direction").value });
        var r = await postJSON("/api/skeleton");
        flowMsg("Draft " + r.id + " created. Fill the [YOUR VOICE] gaps, then run check.");
        renderIdeas([], null);
        document.getElementById("direction").value = "";
        selectedIdea = null;
        load();
      } catch (e) {
        flowMsg(e.message, "err");
        this.disabled = false;
      }
    });

    async function loadIdeas() {
      try {
        var r = await getJSON("/api/ideas");
        if (r.ideas && r.ideas.length) {
          renderIdeas(r.ideas, r.selected_index);
          if (r.comments) document.getElementById("direction").value = r.comments;
        }
      } catch (e) { /* no session yet; ignore */ }
    }

    document.getElementById("refBtn").addEventListener("click", async function () {
      var pre = document.getElementById("reference");
      var btn = this;
      if (!pre.hidden) { pre.hidden = true; btn.textContent = "View"; return; }
      var r = await getJSON("/api/reference");
      pre.textContent = r.exists ? r.content : "No reference yet. Run ingest to build it.";
      pre.hidden = false;
      btn.textContent = "Hide";
    });

    load();
    loadIdeas();
  </script>
</body>
</html>
